# Futur deploiement MaisonLinux / LAN stable.
# L'exposition LAN est pilotee par .env.maisonlinux.

services:
  traefik:
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=${STACK_NETWORK}"
      - "--providers.docker.constraints=Label(`cabinet.stack`,`${STACK_ID}`)"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.traefik.address=:8080"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--ping=true"
      - "--ping.entryPoint=traefik"
      - "--log.level=INFO"
    ports:
      - "${TRAEFIK_HTTP_PORT}:80"
      - "${TRAEFIK_HTTPS_PORT}:443"
      - "127.0.0.1:${TRAEFIK_API_PORT}:8080"

  kafka-ui:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${STACK_NETWORK}"
      - "traefik.http.routers.${STACK_ID}-kafka-ui.rule=Host(`${TRAEFIK_HOST_KAFKA_UI}`)"
      - "traefik.http.routers.${STACK_ID}-kafka-ui.entrypoints=web"
      - "traefik.http.routers.${STACK_ID}-kafka-ui.service=${STACK_ID}-kafka-ui"
      - "traefik.http.services.${STACK_ID}-kafka-ui.loadbalancer.server.port=8080"

  apicurio-registry:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${STACK_NETWORK}"
      - "traefik.http.routers.${STACK_ID}-apicurio.rule=Host(`${TRAEFIK_HOST_REGISTRY}`)"
      - "traefik.http.routers.${STACK_ID}-apicurio.entrypoints=web"
      - "traefik.http.routers.${STACK_ID}-apicurio.service=${STACK_ID}-apicurio"
      - "traefik.http.services.${STACK_ID}-apicurio.loadbalancer.server.port=8080"

  rules-service:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${STACK_NETWORK}"
      - "traefik.http.routers.${STACK_ID}-rules.rule=Host(`${TRAEFIK_HOST_RULES}`)"
      - "traefik.http.routers.${STACK_ID}-rules.entrypoints=web"
      - "traefik.http.routers.${STACK_ID}-rules.service=${STACK_ID}-rules"
      - "traefik.http.services.${STACK_ID}-rules.loadbalancer.server.port=8081"
      - "traefik.http.services.${STACK_ID}-rules.loadbalancer.server.scheme=http"

  api-moteur:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${STACK_NETWORK}"
      - "traefik.http.routers.${STACK_ID}-api-moteur-host.rule=Host(`${TRAEFIK_HOST_API}`)"
      - "traefik.http.routers.${STACK_ID}-api-moteur-host.entrypoints=web"
      - "traefik.http.routers.${STACK_ID}-api-moteur-host.service=${STACK_ID}-api-moteur"
      - "traefik.http.routers.${STACK_ID}-api-moteur-path.rule=Host(`${TRAEFIK_HOST_UI}`) && PathPrefix(`/api/moteur`)"
      - "traefik.http.routers.${STACK_ID}-api-moteur-path.entrypoints=web"
      - "traefik.http.routers.${STACK_ID}-api-moteur-path.service=${STACK_ID}-api-moteur"
      - "traefik.http.routers.${STACK_ID}-api-moteur-path.middlewares=${STACK_ID}-api-moteur-stripprefix"
      - "traefik.http.middlewares.${STACK_ID}-api-moteur-stripprefix.stripprefix.prefixes=/api/moteur"
      - "traefik.http.services.${STACK_ID}-api-moteur.loadbalancer.server.port=8080"

  lobby:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${STACK_NETWORK}"
      - "traefik.http.routers.${STACK_ID}-lobby-host.rule=Host(`${TRAEFIK_HOST_LOBBY}`)"
      - "traefik.http.routers.${STACK_ID}-lobby-host.entrypoints=web"
      - "traefik.http.routers.${STACK_ID}-lobby-host.service=${STACK_ID}-lobby"
      - "traefik.http.routers.${STACK_ID}-lobby-path.rule=Host(`${TRAEFIK_HOST_UI}`) && PathPrefix(`/api/lobby`)"
      - "traefik.http.routers.${STACK_ID}-lobby-path.entrypoints=web"
      - "traefik.http.routers.${STACK_ID}-lobby-path.priority=50"
      - "traefik.http.routers.${STACK_ID}-lobby-path.service=${STACK_ID}-lobby"
      - "traefik.http.routers.${STACK_ID}-lobby-path.middlewares=${STACK_ID}-lobby-stripprefix"
      - "traefik.http.middlewares.${STACK_ID}-lobby-stripprefix.stripprefix.prefixes=/api/lobby"
      - "traefik.http.services.${STACK_ID}-lobby.loadbalancer.server.port=8080"

  ui-etat-joueur:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${STACK_NETWORK}"
      - "traefik.http.routers.${STACK_ID}-ui-etat-host.rule=Host(`${TRAEFIK_HOST_UI_ETAT}`)"
      - "traefik.http.routers.${STACK_ID}-ui-etat-host.entrypoints=web"
      - "traefik.http.routers.${STACK_ID}-ui-etat-host.service=${STACK_ID}-ui-etat"
      - "traefik.http.routers.${STACK_ID}-ui-etat-path.rule=Host(`${TRAEFIK_HOST_UI}`) && PathPrefix(`/api/ui-etat`)"
      - "traefik.http.routers.${STACK_ID}-ui-etat-path.entrypoints=web"
      - "traefik.http.routers.${STACK_ID}-ui-etat-path.priority=50"
      - "traefik.http.routers.${STACK_ID}-ui-etat-path.service=${STACK_ID}-ui-etat"
      - "traefik.http.routers.${STACK_ID}-ui-etat-path.middlewares=${STACK_ID}-ui-etat-stripprefix"
      - "traefik.http.middlewares.${STACK_ID}-ui-etat-stripprefix.stripprefix.prefixes=/api/ui-etat"
      - "traefik.http.services.${STACK_ID}-ui-etat.loadbalancer.server.port=8080"

  ui-web:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${STACK_NETWORK}"
      - "traefik.http.routers.${STACK_ID}-ui-web.rule=Host(`${TRAEFIK_HOST_UI}`) && PathPrefix(`/`) && !PathPrefix(`/api`)"
      - "traefik.http.routers.${STACK_ID}-ui-web.entrypoints=web"
      - "traefik.http.routers.${STACK_ID}-ui-web.service=${STACK_ID}-ui-web"
      - "traefik.http.services.${STACK_ID}-ui-web.loadbalancer.server.port=80"
